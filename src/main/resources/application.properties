spring.application.name=global_meals_gradle
#強制 Spring 印出所有 Web 相關的錯誤
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

#修改 server 啟動的 port，預設是 8080
#server.port=8083
#設定資料庫連接
# 3306是連接 mysql 的 port；global_meals 是要連接的資料庫名稱
# rewriteBatchedStatements=true: 可以批次新增
spring.datasource.url=jdbc:mysql://localhost:3306/global_meals?serverTimezone=GMT%2B8&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
##session
#server.servlet.session.cookie.same-site=none;
#server.servlet.session.cookie.secure=true;

#sql schema 檔案來源: 創建表和欄位的語法，包含欄位名稱、資料型態、限制、預設值等
#classpath 是指 路徑src/main/resources
#spring.sql.init.schema-locations=classpath:schema-mysql.sql
#[always][embedded][never]
spring.sql.init.mode=always
#sql 測試資料來源: 新增測試資料的語法
#spring.sql.init.data-locations=classpath:data-mysql.sql
#會自動產生 table，但 schema 和 entity 要先建立
#spring.jpa.generate-ddl=false

#Spring Boot 允許的上傳大小，否則超過 1MB 的圖片會被攔截
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

rate.api.key=${RATE_API_KEY}
ai.product.key=${AI_PRODUCT_KEY}
ai.promo.key=${AI_PROMO_KEY}

#用於 Rate 設定檔
# 本地用，Railway 會被 SPRING_PROFILES_ACTIVE=prod 覆蓋
spring.profiles.active=secrets
